# Rāsikh downloads: the printed muṣḥafs' packs and their signed catalog.
# Static files only, read-only, GET and HEAD only. Goes in the nginx
# container's conf.d/ (inside the http block). Replace dl.example.com with
# your subdomain (3 places) — see server/downloads/README.md.

# ── limits, per address ──
limit_req_zone  $binary_remote_addr zone=rasikh_dl_req:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=rasikh_dl_conn:10m;

# ── logs without whole addresses (GDPR): the last part of each zeroed ──
map $remote_addr $rasikh_dl_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+    $ip.0;
    ~(?P<ip>[^:]+:[^:]+:[^:]+):    $ip::;
    default                        0.0.0.0;
}
log_format rasikh_dl '$rasikh_dl_anon [$time_local] "$request" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name dl.example.com;

    # Let's Encrypt's check (if certificates come from certbot's webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dl.example.com;

    ssl_certificate     /etc/letsencrypt/live/dl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dl.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    # Too many at once: "too many requests" (this site only).
    limit_req_status  429;
    limit_conn_status 429;
    access_log /var/log/nginx/rasikh-dl.access.log rasikh_dl;
    error_log  /var/log/nginx/rasikh-dl.error.log warn;

    root /srv/rasikh-dl;
    autoindex off;
    disable_symlinks on;
    client_max_body_size 1k;   # nothing is ever uploaded through the web

    # The catalog: always the newest (the app checks its signature).
    location ~ ^/catalog\.json(\.sig)?$ {
        limit_except GET HEAD { deny all; }
        limit_req zone=rasikh_dl_req burst=10 nodelay;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The packs: never changed once published (a new build is a new name),
    # so cached for good; resumable (nginx answers Range by itself).
    location ^~ /packs/ {
        limit_except GET HEAD { deny all; }
        limit_req  zone=rasikh_dl_req burst=10 nodelay;
        limit_conn rasikh_dl_conn 3;
        location ~ ^/packs/[a-z0-9-]+\.zip$ {
            limit_except GET HEAD { deny all; }
            limit_conn rasikh_dl_conn 3;
            types { application/zip zip; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        return 404;
    }

    # Nothing else here.
    location / {
        return 404;
    }
}
