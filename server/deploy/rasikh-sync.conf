# Rāsikh sync (accounts, mark books): nginx in front of the PocketBase
# container (server/deploy/Containerfile), both on the podman network
# "rasikh". Goes in the nginx container's conf.d/. Replace sync.example.com
# (3 places) and, under /_/, the address allowed to the admin dashboard.

limit_req_zone $binary_remote_addr zone=rasikh_sync:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sync.example.com;

    ssl_certificate     /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 10m;
    limit_req_status 429;
    # The anonymised log format from rasikh-dl.conf (no whole addresses).
    access_log /var/log/nginx/rasikh-sync.access.log rasikh_dl;
    error_log  /var/log/nginx/rasikh-sync.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The admin dashboard: your address only (or none, and an SSH tunnel).
    location ^~ /_/ {
        allow 203.0.113.7;   # ← your home IP
        deny all;
        proxy_pass http://rasikh-sync:8090;
        include /etc/nginx/conf.d/rasikh-sync.proxy;
    }

    # Live updates (server-sent events): unbuffered, long-lived.
    location = /api/realtime {
        proxy_pass http://rasikh-sync:8090;
        include /etc/nginx/conf.d/rasikh-sync.proxy;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    location / {
        limit_req zone=rasikh_sync burst=40 nodelay;
        proxy_pass http://rasikh-sync:8090;
        include /etc/nginx/conf.d/rasikh-sync.proxy;
    }
}
