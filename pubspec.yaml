name: qiraah_arabiyyah
description: "Qiraah Arabiyyah — a modern Arabic reading & writing journey: Qaidah, tracing with stroke direction, Tashkil counts, Tajwid, dyslexia-friendly practice, and the 10 Qira'at."
publish_to: 'none'
version: 3.0.1+301

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.0.10
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0
  http: ^1.2.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: lets test/kids_mode_test.dart fake path_provider's platform
  # channel (BackupService writes to the app documents dir) without a device.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  # Runs gen_l10n on build: lib/l10n/*.arb -> AppLocalizations (see l10n.yaml).
  generate: true
  assets:
    - assets/brand/
    - assets/avatars/
    - assets/quran/
    - assets/quran/u/
    - assets/quran/i/
    - assets/quran/t/
    - assets/quran/t_indopak/
    - assets/special_cases/
    - assets/special_cases/examples/
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew.ttf
    - family: DigitalKhattV2
      fonts:
        - asset: assets/fonts/DigitalKhattV2.otf
    - family: DigitalKhattIndoPak
      fonts:
        - asset: assets/fonts/DigitalKhattIndoPak.otf
    - family: SurahNames
      fonts:
        - asset: assets/fonts/SurahNames.ttf
    - family: Bismillah
      fonts:
        - asset: assets/fonts/Bismillah.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    # Kids Mode's redesign (design_handoff_flutter/, built by tool/kb_fonts.py).
    # Static instances of the upstream variable fonts, as with Baloo2 above.
    - family: Baloo Bhaijaan 2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2-Medium.ttf
          weight: 500
        - asset: assets/fonts/BalooBhaijaan2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BalooBhaijaan2-Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooBhaijaan2-ExtraBold.ttf
          weight: 800
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Material Symbols Rounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded-Kids.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Variable.ttf
