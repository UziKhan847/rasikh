name: qiraah_arabiyyah
description: "Qiraah Arabiyyah — a modern Arabic reading & writing journey: Qaidah, tracing with stroke direction, Tashkil counts, Tajwid, dyslexia-friendly practice, and the 10 Qira'at."
publish_to: 'none'
version: 3.0.7+307

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.0.10
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0
  http: ^1.2.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  pocketbase: ^0.25.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Runs gen_l10n on build: lib/l10n/*.arb -> AppLocalizations (see l10n.yaml).
  generate: true
  assets:
    - assets/brand/
    - assets/quran/
    - assets/quran/atlas/
    - assets/quran/u/
    - assets/quran/i/
    - assets/quran/t/
    - assets/quran/t_indopak/
    - assets/special_cases/
    - assets/special_cases/examples/
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew.ttf
    - family: DigitalKhattV2
      fonts:
        - asset: assets/fonts/DigitalKhattV2.otf
    - family: DigitalKhattIndoPak
      fonts:
        - asset: assets/fonts/DigitalKhattIndoPak.otf
    - family: SurahNames
      fonts:
        - asset: assets/fonts/SurahNames.ttf
    - family: Bismillah
      fonts:
        - asset: assets/fonts/Bismillah.ttf
    # The redesign (design_handoff_qiraah_flutter): UI icons, UI and display
    # type, and the letter face. Static instances (see CREDITS.md). Inter and
    # Source Serif 4 stand in for the design's Hanken Grotesk and Newsreader:
    # same feel, and they carry every transliteration mark (ā ḥ ṣ ʿ ʼ …).
    - family: QiraahIcons
      fonts:
        - asset: assets/fonts/QiraahIcons.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Variable.ttf
