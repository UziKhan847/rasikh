name: rasikh
description: "Rāsikh — the Qurʾān for hifẓ and reading: the 15-line muṣḥaf, marking and reviewing recitation, memorising, and fluency practice."
publish_to: 'none'
version: 1.1.3+113

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The family's shared look (theme, kit, icons): one copy for all three apps.
  qiraah_ui:
    path: ../qiraah_ui
  intl: ^0.20.2
  flutter_svg: ^2.0.10
  path_parsing: ^1.1.0
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0
  http: ^1.2.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  pocketbase: ^0.25.2
  # Marks report: the PDF itself, and the share sheet / print preview.
  pdf: ^3.13.0
  printing: ^5.14.2
  # Fluency practice: a cold read is recorded to play back.
  record: ^7.1.2
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  window_manager: ^0.5.1
  image: ^4.12.0
  sherpa_onnx: ^2.0.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Makes the launcher icons from assets/apk_icons (flutter_launcher_icons.yaml).
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Runs gen_l10n on build: lib/l10n/*.arb -> AppLocalizations (see l10n.yaml).
  generate: true
  assets:
    - assets/brand/
    - assets/ornaments/
    - assets/quran/
    - assets/quran/atlas/
    - assets/nabr/
    - assets/quran/u/
    - assets/quran/i/
    - assets/quran/t/
    - assets/quran/t_indopak/
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew.ttf
    - family: DigitalKhattV2
      fonts:
        - asset: assets/fonts/DigitalKhattV2.otf
    - family: DigitalKhattIndoPak
      fonts:
        - asset: assets/fonts/DigitalKhattIndoPak.otf
    - family: SurahNames
      fonts:
        - asset: assets/fonts/SurahNames.ttf
    - family: Bismillah
      fonts:
        - asset: assets/fonts/Bismillah.ttf
    # The redesign (design_handoff_qiraah_flutter): UI icons, UI and display
    # type, and the letter face. Static instances (see CREDITS.md). Inter and
    # Source Serif 4 stand in for the design's Hanken Grotesk and Newsreader:
    # same feel, and they carry every transliteration mark (ā ḥ ṣ ʿ ʼ …).
    - family: QiraahIcons
      fonts:
        - asset: packages/qiraah_ui/fonts/QiraahIcons.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Variable.ttf
