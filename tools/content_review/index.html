<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qiraah Content Review</title>
<!-- Content: content.js (tool/content_review/gen_content_test.dart). The
     single-file build inlines it and the fonts below. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="content.js"></script>
<style>
@font-face{font-family:UthmanicHafs;src:url('../../assets/fonts/UthmanicHafs.ttf')}
@font-face{font-family:DigitalKhatt;src:url('../../assets/fonts/DigitalKhattV2.otf')}
@font-face{font-family:Naskh;src:url('../../assets/fonts/NotoNaskhArabic-Regular.ttf')}
@font-face{font-family:Scheherazade;src:url('../../assets/fonts/ScheherazadeNew.ttf')}
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d2420;--ink2:#4b544f;--ink3:#7a817c;--line:#e3dccb;--acc:#0f6e58;--accSoft:#e3f1ec;
  --ok:#16875a;--chg:#c0392b;--q:#b87a00;--chip:#efe9dc;--side:#efeadf}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1c211f;--ink:#e8ece9;--ink2:#b9c1bc;--ink3:#8a938e;--line:#2f3632;
  --acc:#4fc3a1;--accSoft:#1f3a32;--chip:#262c29;--side:#181d1b}}
:root[data-theme="dark"]{--bg:#141816;--card:#1c211f;--ink:#e8ece9;--ink2:#b9c1bc;--ink3:#8a938e;--line:#2f3632;--acc:#4fc3a1;--accSoft:#1f3a32;--chip:#262c29;--side:#181d1b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[dir=rtl] body,[dir=rtl] .ui{font-family:Naskh,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:17px;margin:0 12px 0 0}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.pill:hover{border-color:var(--acc)}
.pill.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.pill.on{background:var(--accSoft);border-color:var(--acc)}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
textarea{width:100%;min-height:60px;resize:vertical}
.wrap{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 58px)}
nav{background:var(--side);border-inline-end:1px solid var(--line);padding:10px 8px;overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
nav .sec{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:14px}
nav .sec:hover{background:var(--chip)}
nav .sec.sel{background:var(--accSoft);font-weight:600}
nav .count{font-size:11.5px;color:var(--ink3);white-space:nowrap}
nav .kids{margin-inline-start:12px}
main{padding:16px;max-width:1100px}
.crumbs{color:var(--ink3);font-size:13px;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.card.ok{border-inline-start:5px solid var(--ok)}.card.change{border-inline-start:5px solid var(--chg)}.card.question{border-inline-start:5px solid var(--q)}
.card h3{margin:0 0 2px;font-size:16px}
.meta{color:var(--ink3);font-size:12px}
.hero{font-family:UthmanicHafs,Naskh,serif;font-size:34px;direction:rtl;text-align:right;line-height:1.7}
.ar{font-family:UthmanicHafs,Naskh,serif;direction:rtl;font-size:21px;line-height:1.9}
.arN{font-family:Naskh,serif;direction:rtl;font-size:17px;line-height:1.9}
.quran{font-family:UthmanicHafs,serif;font-size:1.15em}
.field{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:6px 0;padding-top:6px;border-top:1px dashed var(--line)}
.field .k{color:var(--ink3);font-size:12.5px;padding-top:3px}
.lang{display:flex;gap:8px;align-items:baseline}
.lang b{font-size:11px;color:var(--ink3);min-width:22px;text-transform:uppercase}
.flag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--ink2);margin-inline-end:4px}
.flag.warn{background:#fbe3dc;color:#9a2d1c}
.ex{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:3px 0}
.ex .ref{font-size:12px;color:var(--ink3)}
mark{background:#f6e2a8;color:inherit;border-radius:3px;padding:0 1px}
.review{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:8px}
.status{display:flex;gap:6px;flex-wrap:wrap}
.status .pill.sel-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.status .pill.sel-change{background:var(--chg);color:#fff;border-color:var(--chg)}
.status .pill.sel-question{background:var(--q);color:#fff;border-color:var(--q)}
.comment{background:var(--chip);border-radius:10px;padding:6px 10px;font-size:14px}
.comment .by{font-size:11.5px;color:var(--ink3)}
.files{display:flex;gap:6px;flex-wrap:wrap}
.file{font-size:12.5px;background:var(--chip);border-radius:8px;padding:3px 8px}
.file a{color:var(--acc)}
.file button{border:0;background:none;color:var(--chg);cursor:pointer}
.changed{color:var(--chg);font-weight:600;font-size:12.5px}
.tok{display:inline-block;font-family:Scheherazade,UthmanicHafs,serif;font-size:26px;padding:0 6px;margin:2px;border:1px solid var(--line);border-radius:8px;min-width:34px;text-align:center}
.toks{direction:rtl;display:flex;flex-wrap:wrap}
.tok.st{color:#fff}
.nabr-rule{background:var(--accSoft);border-radius:12px;padding:8px 12px}
.note-warning{background:#fbe3dc33;border-inline-start:4px solid #c0392b;padding:6px 10px;border-radius:8px}
.note-tip{background:#f6e2a833;border-inline-start:4px solid #b4862c;padding:6px 10px;border-radius:8px}
.note-summary{background:#cbe3d633;border-inline-start:4px solid #16875a;padding:6px 10px;border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t td,table.t th{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
.opt{padding:3px 8px;border-radius:8px;margin:2px 0}
.opt.right{background:#d8efe3;color:#0d4f35}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-inline-end:4px}
.svg img{max-height:120px;background:#fff;border-radius:8px;padding:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.summary{color:var(--ink2);font-size:13px}
.muted{color:var(--ink3)}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;max-height:40vh}.grid2{grid-template-columns:1fr}.field{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="ui">
  <h1 id="tTitle">Content review</h1>
  <label class="summary"><span id="tReviewer">Reviewer</span>: <input type="text" id="reviewer" size="14"></label>
  <input type="search" id="search" size="16">
  <select id="filter"></select>
  <label class="summary"><input type="checkbox" id="langsAll"> <span id="tAllLangs">All languages</span></label>
  <span class="summary" id="progress"></span>
  <span style="flex:1"></span>
  <button class="pill" id="uiLang">العربية</button>
  <button class="pill" id="importBtn"></button>
  <button class="pill primary" id="exportBtn"></button>
  <input type="file" id="importFile" accept=".zip,.json" hidden>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const C = window.CONTENT || {sections: [], items: {}, locales: ['en']};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ───────── interface strings ─────────
const T = {
  en: {title:'Content review', reviewer:'Reviewer', search:'Search…', allLangs:'All languages', import:'Import', export:'Export zip',
    f_all:'All items', f_unreviewed:'Not reviewed', f_ok:'Approved', f_change:'Needs change', f_question:'Question', f_changed:'Changed since reviewed', f_english:'English only (untranslated)',
    s_unreviewed:'Not reviewed', s_ok:'Approved', s_change:'Needs change', s_question:'Question',
    comment:'Comment', addComment:'Add comment', correct:'Suggest corrected text', attach:'Attach files', changedSince:'Changed since it was reviewed — please look again',
    reviewed:'reviewed', of:'of', items:'items', appears:'Appears in', englishOnly:'English only', locked:'Locked in the app', customDetail:'Has a custom screen (not all shown here)',
    dartArbDiffer:'Two copies differ', noItems:'Nothing here with this filter.', pickSection:'Choose a section on the left.', save:'Save', saved:'Saved',
    exported:'Exported', imported:'Imported', needName:'Enter your name first (top bar).', zipMissing:'The zip library did not load (offline?) — exporting review.json without attachments.',
    examples:'Examples',noStorage:'This browser can\'t save here — your review lives in this tab only. Export before closing.', correctAnswer:'Answer', why:'Why', stressed:'Stressed', expected:'Expected', exceptions:'Exceptions', remove:'Remove'},
  ar: {title:'مراجعة المحتوى', reviewer:'المراجِع', search:'بحث…', allLangs:'كل اللغات', import:'استيراد', export:'تصدير ملف مضغوط',
    f_all:'كل العناصر', f_unreviewed:'لم يُراجَع', f_ok:'مقبول', f_change:'يحتاج تعديلًا', f_question:'سؤال', f_changed:'تغيّر بعد المراجعة', f_english:'بالإنجليزية فقط (غير مترجم)',
    s_unreviewed:'لم يُراجَع', s_ok:'مقبول', s_change:'يحتاج تعديلًا', s_question:'سؤال',
    comment:'تعليق', addComment:'أضف تعليقًا', correct:'اقترح نصًّا مصحَّحًا', attach:'إرفاق ملفات', changedSince:'تغيّر المحتوى بعد مراجعته — يُرجى النظر فيه مجددًا',
    reviewed:'رُوجِع', of:'من', items:'عنصر', appears:'يظهر في', englishOnly:'إنجليزي فقط', locked:'مقفل في التطبيق', customDetail:'له شاشة خاصة (لا يظهر كله هنا)',
    dartArbDiffer:'نسختان مختلفتان', noItems:'لا شيء هنا بهذا المرشِّح.', pickSection:'اختر قسمًا من الجانب.', save:'حفظ', saved:'حُفِظ',
    exported:'صُدِّر', imported:'استُورِد', needName:'اكتب اسمك أولًا (في الأعلى).', zipMissing:'لم تُحمَّل مكتبة الضغط — سيُصدَّر review.json بلا مرفقات.',
    examples:'أمثلة',noStorage:'لا يمكن الحفظ في هذا المتصفح — المراجعة في هذه النافذة فقط. صدّرها قبل الإغلاق.', correctAnswer:'الإجابة', why:'السبب', stressed:'المنبور', expected:'المتوقَّع', exceptions:'الاستثناءات', remove:'حذف'},
};
const FIELD = {en:{title:'Title',summary:'Summary',intro:'Explanation',group:'Group',letters:'Letters',build:'Build',buildCells:'Steps',translit:'Transliteration',dots:'Dots',note:'Note',
  subtitle:'Subtitle',tier:'Tier',glyphs:'Forms',city:'City',died:'Died',rawis:'Transmitters',signatures:'Features',bio:'Biography',topic:'Topic',hafs:'Ḥafṣ',variant:'Variant',readBy:'Read by',ref:'Reference',dart:'In code',arb:'In translations'},
  ar:{title:'العنوان',summary:'الملخّص',intro:'الشرح',group:'المجموعة',letters:'الحروف',build:'التركيب',buildCells:'الخطوات',translit:'النطق اللاتيني',dots:'النقاط',note:'ملاحظة',
  subtitle:'العنوان الفرعي',tier:'المستوى',glyphs:'الأشكال',city:'المدينة',died:'الوفاة',rawis:'الراويان',signatures:'السمات',bio:'نبذة',topic:'الموضوع',hafs:'حفص',variant:'الوجه',readBy:'قرأ به',ref:'المرجع',dart:'في الشيفرة',arb:'في ملفات الترجمة'}};
let ui = localStorage.getItem('cr.ui') || 'en';
const t = k => T[ui][k] ?? T.en[k] ?? k;
const fieldLabel = k => k.startsWith('fact') ? (ui==='ar' ? 'معلومة' : 'Fact') : (FIELD[ui][k] || FIELD.en[k] || k);
const LANG_RTL = new Set(['ar','ur']);

// ───────── review state (IndexedDB) ─────────
let db, state = {};
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('qiraah-content-review',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('state');d.createObjectStore('files')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const mem={state:new Map(),files:new Map()};
const tx=(store,mode,fn)=>!db?Promise.resolve(fn({put:(v,k)=>mem[store].set(k,v),delete:k=>mem[store].delete(k)})):new Promise((res,rej)=>{const x=db.transaction(store,mode);const s=x.objectStore(store);const out=fn(s);
  x.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);x.onerror=()=>rej(x.error)});
async function loadState(){const all={};await new Promise((res,rej)=>{const x=db.transaction('state').objectStore('state').openCursor();
  x.onsuccess=()=>{const c=x.result;if(c){all[c.key]=c.value;c.continue()}else res()};x.onerror=()=>rej(x.error)});state=all}
function rs(id){return state[id] || {status:'unreviewed',comments:[],corrections:{},files:[]}}
async function put(id, s){s.updatedAt=new Date().toISOString();s.updatedBy=reviewer();state[id]=s;await tx('state','readwrite',st=>st.put(s,id))}
// Files are kept as their bytes and type (Blobs in IndexedDB aren't safe
// everywhere) and come back as Blobs.
const bytes=b=>b.arrayBuffer?b.arrayBuffer():new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(b)});
const putFile=async(key,blob)=>{const v={type:blob.type||'',data:await bytes(blob)};return tx('files','readwrite',s=>s.put(v,key))};
const asBlob=v=>v&&(v.data?new Blob([v.data],{type:v.type}):v);
const getFile=key=>!db?Promise.resolve(asBlob(mem.files.get(key))):new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').get(key);r.onsuccess=()=>res(asBlob(r.result));r.onerror=()=>rej(r.error)});
const delFile=key=>tx('files','readwrite',s=>s.delete(key));
const reviewer=()=>($('#reviewer').value||'').trim();

// ───────── navigation ─────────
const secById = Object.fromEntries(C.sections.map(s=>[s.id,s]));
const kids = id => C.sections.filter(s=>(s.parent??null)===id);
const secTitle = s => (s.title && (s.title[ui] || s.title.en || Object.values(s.title)[0])) || s.id;
function secItems(id){const out=[...(secById[id]?.items||[])];for(const k of kids(id))out.push(...secItems(k.id));return out}
let current = localStorage.getItem('cr.sec') || (C.sections[0]||{}).id;
// A link can open a section (#sec=<id>) and the interface language (&ui=ar).
{const h=new URLSearchParams(location.hash.slice(1));if(h.get('sec'))current=h.get('sec');if(h.get('ui'))ui=h.get('ui')==='ar'?'ar':'en'}

function changed(id){const s=state[id];return s && s.status!=='unreviewed' && s.reviewedHash && C.items[id] && s.reviewedHash!==C.items[id].hash}
function matches(id){
  const it=C.items[id]; if(!it) return false;
  const f=$('#filter').value, s=rs(id);
  if(f==='changed'&&!changed(id))return false;
  if(f==='english'&&!(it.flags||[]).includes('englishOnly'))return false;
  if(['unreviewed','ok','change','question'].includes(f)&&s.status!==f)return false;
  const q=$('#search').value.trim().toLowerCase();
  if(q&&!JSON.stringify(it).toLowerCase().includes(q))return false;
  return true;
}
function counts(ids){let done=0;for(const id of ids)if(rs(id).status!=='unreviewed')done++;return [done,ids.length]}

function renderNav(){
  const build=(parent)=>kids(parent).map(s=>{
    const [d,n]=counts(secItems(s.id));const k=build(s.id);
    return `<div><div class="sec ${s.id===current?'sel':''}" data-sec="${esc(s.id)}"><span>${esc(secTitle(s))}</span><span class="count">${d}/${n}</span></div>${k?`<div class="kids">${k}</div>`:''}</div>`}).join('');
  $('#nav').innerHTML=build(null);
  const all=Object.keys(C.items);const [d,n]=counts(all);
  $('#progress').textContent=`${d} ${t('of')} ${n} ${t('reviewed')}`;
}

// ───────── rendering helpers ─────────
function md(s){ // markdown-lite: ***b-i***, **b**, *i*, ﴿ … ﴾
  let h=esc(s);
  h=h.replace(/\*\*\*(.+?)\*\*\*/g,'<b><i>$1</i></b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
  return h.replace(/﴿([^﴾]*)﴾/g,'<span class="quran">﴿$1﴾</span>');
}
const arEn=(ar,en)=>`${ar?`<div class="arN">${md(ar)}</div>`:''}${en?`<div dir="ltr">${md(en)}</div>`:''}`;
function hl(text,h){if(!h||!text.includes(h))return esc(text);const i=text.indexOf(h);return esc(text.slice(0,i))+'<mark>'+esc(h)+'</mark>'+esc(text.slice(i+h.length))}
const LEVEL = {}; // nabr colour levels by id
for(const it of Object.values(C.items)) if(it.kind==='nabr.level'&&it.raw?.id) LEVEL[it.raw.id]=it.raw;
const lvColour = id => (LEVEL[id]||LEVEL.medium||{}).light || '#1565c0';
function tokens(toks, stressed=[], nonSel=[], colour=lvColour('medium')){
  return `<div class="toks">${(toks||[]).map((x,i)=>`<span class="tok ${stressed.includes(i)?'st':''}" style="${stressed.includes(i)?`background:${colour};border-color:${colour}`:''}${nonSel.includes(i)?';opacity:.45':''}">${esc(x)}</span>`).join('')}</div>`;
}

function renderNabr(it){
  const r=it.raw||{};
  switch(it.kind){
    case 'nabr.meta': return `<div class="field"><div class="k">${ui==='ar'?'العنوان':'Title'}</div><div>${arEn(r.title?.ar,r.title?.en)}</div></div>
      <div class="field"><div class="k">${ui==='ar'?'المصدر':'Based on'}</div><div>${arEn(r.basedOn?.ar,r.basedOn?.en)}</div></div>
      <div class="field"><div class="k">${ui==='ar'?'الرواية':'Riwāya'}</div><div>${esc(r.riwaya)}</div></div>`;
    case 'nabr.guide': return `<div>${md(r.principle)}</div>`;
    case 'nabr.level': return `<h3><span class="swatch" style="background:${esc(r.light||'#888')}"></span><span class="swatch" style="background:${esc(r.dark||'#888')}"></span>${esc(r.en||r.id)} · <span class="arN">${esc(r.ar||'')}</span></h3>
      ${arEn(r.descAr,r.descEn)}${(r.examples||[]).length?`<div class="ar">${r.examples.map(esc).join(' · ')}</div>`:''}`;
    case 'nabr.block': return renderBlock(r);
    case 'nabr.drill': return `<div class="hero">${esc(r.word)}</div>${tokens(r.tokens,r.correct||[],r.nonSelectable||[])}
      <div class="field"><div class="k">${t('correctAnswer')}</div><div>${arEn(r.answerAr,r.answerEn)}</div></div>
      <div class="field"><div class="k">${t('why')}</div><div>${arEn(r.explanationAr,r.explanationEn)}</div></div>
      <div class="meta">${esc(r.mode||'')} · ${esc(r.source||'')}</div>`;
    case 'nabr.quiz': return `${arEn(r.promptAr,r.promptEn)}<div>${(r.options||[]).map((o,i)=>`<div class="opt ${i===r.correctIndex?'right':''}">${i===r.correctIndex?'✓ ':''}<span class="arN">${esc(o.ar)}</span> — ${esc(o.en)}</div>`).join('')}</div>
      <div class="field"><div class="k">${t('why')}</div><div>${arEn(r.explanationAr,r.explanationEn)}</div></div><div class="meta">${esc(r.kind)} · ${esc(r.source||'')}</div>`;
    case 'nabr.golden': return `<div class="hero">${esc(r.text)}</div>${tokens(r.tokens,r.expectedStressedTokenIndices||[])}
      <div class="field"><div class="k">${t('why')}</div><div>${arEn(r.reasonAr,r.reasonEn)}</div></div><div class="meta">${esc(r.context||'')} · ${esc(r.source||'')}</div>`;
    case 'nabr.special': return `<div class="field"><div class="k">${ui==='ar'?'الافتراضي':'Default'}</div><div>${esc(JSON.stringify(r.default||{}))}</div></div>
      ${(r.exceptions||[]).length?`<table class="t"><tr><th>${t('exceptions')}</th><th></th><th></th></tr>${r.exceptions.map(e=>`<tr><td>${esc(e.ref)}</td><td class="ar">${esc(e.word||'')}</td><td>${esc(e.stressOn||'')} ${esc(e.level||'')}</td></tr>`).join('')}</table>`:''}
      ${r.note?`<div class="meta">${md(r.note)}</div>`:''}<details><summary class="meta">JSON</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(r,null,1))}</pre></details>`;
    case 'nabr.tone': return `<div><b>${esc(r.group)}</b> · ${esc(r.ref||'')}</div>${r.phrase?`<div class="ar">${esc(r.phrase)}</div>`:''}<div>${esc(r.reasonEn||r.noteEn||'')}</div>`;
  }
  return `<pre>${esc(JSON.stringify(r,null,1))}</pre>`;
}
function renderBlock(b){
  const cell=c=>arEn(c?.ar,c?.en);
  switch(b.type){
    case 'paragraph': return arEn(b.ar,b.en);
    case 'section': return `<h3>${arEn(b.titleAr,b.titleEn)}</h3>`;
    case 'rule': return `<div class="nabr-rule"><b>${ui==='ar'?'قاعدة':'Rule'} ${esc(b.num??'')}</b>${arEn(b.ar,b.en)}</div>`;
    case 'note': return `<div class="note-${esc(b.kind)}">${arEn(b.ar,b.en)}</div>`;
    case 'examples': return (b.items||[]).map(e=>`<div class="card"><div class="hero">${esc(e.word)}</div>${tokens(e.tokens,e.stressedTokenIndices||[])}
        <div class="field"><div class="k">${t('stressed')}</div><div>${arEn(e.stressOn?.ar,e.stressOn?.en)}</div></div>
        <div class="field"><div class="k">${t('why')}</div><div>${arEn(e.whyAr,e.whyEn)}</div></div></div>`).join('');
    case 'table': return `<table class="t"><tr>${(b.columns||[]).map(c=>`<th>${cell(c)}</th>`).join('')}</tr>${(b.rows||[]).map(r=>`<tr>${r.map(c=>`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</table>`;
    case 'takeaways': return `<ul>${(b.items||[]).map(i=>`<li>${arEn(i.ar,i.en)}</li>`).join('')}</ul>`;
    case 'practice': return `<div class="meta">${esc(b.set||'')}</div><div class="ar">${(b.items||[]).map(esc).join(' · ')}</div>
      <details><summary>${t('correctAnswer')}</summary>${renderBlock({type:'examples',items:b.answers||[]})}</details>`;
  }
  return `<pre>${esc(JSON.stringify(b,null,1))}</pre>`;
}

function renderFields(it){
  const langs = $('#langsAll').checked ? C.locales : (ui==='ar'?['ar','en']:['en','ar']);
  return (it.fields||[]).map(f=>{
    const rows=langs.filter(l=>f.text[l]!==undefined).map(l=>`<div class="lang"><b>${l}</b><div ${LANG_RTL.has(l)?'dir="rtl" class="arN"':''}>${esc(f.text[l])}</div></div>`).join('');
    if(!rows)return '';
    return `<div class="field"><div class="k">${esc(fieldLabel(f.key))}${f.englishOnly?`<br><span class="flag warn">${t('englishOnly')}</span>`:''}</div><div>${rows}</div></div>`}).join('');
}

function renderItem(id){
  const it=C.items[id], s=rs(id);
  const flags=(it.flags||[]).filter(f=>f!=='englishOnly').map(f=>`<span class="flag ${f==='dartArbDiffer'?'warn':''}">${esc(t(f))}</span>`).join('');
  const title=(it.fields||[]).find(f=>f.key==='title');
  const head=title?esc(title.text[ui]||title.text.en||Object.values(title.text)[0]):'';
  const body=it.kind.startsWith('nabr.')?renderNabr(it):`${it.arabic?`<div class="hero">${esc(it.arabic)}</div>`:''}${renderFields(it)}
    ${(it.examples||[]).length?`<div class="field"><div class="k">${t('examples')}</div><div>${it.examples.map(e=>`<div class="ex"><span class="ar">${hl(e.text,e.highlight)}</span><span class="ref">${esc(e.ref||'')} ${esc(e.note||'')}</span></div>`).join('')}</div></div>`:''}
    ${it.svg?`<div class="svg"><img alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(it.svg)}"></div>`:''}`;
  const comments=(s.comments||[]).map(c=>`<div class="comment"><div class="by">${esc(c.by||'?')} · ${esc((c.at||'').slice(0,16).replace('T',' '))}</div>${esc(c.text).replace(/\n/g,'<br>')}</div>`).join('');
  const files=(s.files||[]).map(f=>`<span class="file"><a href="#" data-dl="${esc(id)}" data-name="${esc(f.name)}">${esc(f.name)}</a> <button data-rm="${esc(id)}" data-name="${esc(f.name)}" title="${t('remove')}">✕</button></span>`).join('');
  const corrFields=(it.fields||[]).filter(f=>Object.keys(f.text).length);
  const corr=corrFields.length?`<details ${Object.keys(s.corrections||{}).length?'open':''}><summary>${t('correct')}</summary>${corrFields.map(f=>{
      const langs=$('#langsAll').checked?C.locales:['en','ar'];
      return langs.filter(l=>f.text[l]!==undefined).map(l=>`<div class="field"><div class="k">${esc(fieldLabel(f.key))} · ${l}</div><textarea ${LANG_RTL.has(l)?'dir="rtl"':''} data-corr="${esc(id)}" data-field="${esc(f.key)}" data-lang="${l}">${esc(s.corrections?.[f.key]?.[l] ?? f.text[l])}</textarea></div>`).join('')}).join('')}</details>`
    :`<details ${Object.keys(s.corrections||{}).length?'open':''}><summary>${t('correct')}</summary><textarea data-corr="${esc(id)}" data-field="text" data-lang="any">${esc(s.corrections?.text?.any ?? '')}</textarea></details>`;
  return `<div class="card ${s.status}" id="item-${esc(id)}">
    <div class="meta">${esc(id)}${it.path?.length?' · '+esc(it.path.join(' › ')):''}</div>
    ${head?`<h3>${head}</h3>`:''}${flags}
    ${changed(id)?`<div class="changed">${t('changedSince')}</div>`:''}
    ${body}
    ${(it.appearsIn||[]).length>1?`<div class="meta">${t('appears')}: ${it.appearsIn.map(esc).join(' · ')}</div>`:''}
    <div class="review">
      <div class="status">${['unreviewed','ok','change','question'].map(k=>`<button class="pill ${s.status===k&&k!=='unreviewed'?'sel-'+k:''}" data-status="${esc(id)}" data-v="${k}">${t('s_'+k)}</button>`).join('')}</div>
      ${comments}
      <textarea placeholder="${t('comment')}" data-comment="${esc(id)}"></textarea>
      <div><button class="pill" data-addc="${esc(id)}">${t('addComment')}</button>
        <label class="pill">${t('attach')}<input type="file" multiple hidden data-attach="${esc(id)}"></label></div>
      <div class="files">${files}</div>
      ${corr}
    </div></div>`;
}

function renderMain(){
  const sec=secById[current];
  if(!sec){$('#main').innerHTML=`<p class="muted">${t('pickSection')}</p>`;return}
  const crumbs=[];for(let s=sec;s;s=secById[s.parent])crumbs.unshift(secTitle(s));
  const ids=(sec.items||[]).filter(matches);
  const sub=kids(sec.id).map(k=>{const [d,n]=counts(secItems(k.id));return `<button class="pill" data-sec="${esc(k.id)}">${esc(secTitle(k))} · ${d}/${n}</button>`}).join(' ');
  $('#main').innerHTML=`<div class="crumbs">${crumbs.map(esc).join(' › ')}</div>${sub?`<div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px">${sub}</div>`:''}
    ${ids.length?ids.map(renderItem).join(''):((sec.items||[]).length?`<p class="muted">${t('noItems')}</p>`:'')}`;
}
function renderAll(){renderNav();renderMain()}

// ───────── events ─────────
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-sec],[data-status],[data-addc],[data-dl],[data-rm]');if(!el)return;
  if(el.dataset.sec){current=el.dataset.sec;localStorage.setItem('cr.sec',current);renderAll();window.scrollTo(0,0);return}
  if(!reviewer()){toast(t('needName'));$('#reviewer').focus();return}
  if(el.dataset.status){const id=el.dataset.status,s=rs(id);s.status=el.dataset.v;s.reviewedHash=C.items[id].hash;await put(id,s);refreshItem(id);renderNav()}
  else if(el.dataset.addc){const id=el.dataset.addc,ta=document.querySelector(`[data-comment="${CSS.escape(id)}"]`);const text=ta.value.trim();if(!text)return;
    const s=rs(id);(s.comments=s.comments||[]).push({by:reviewer(),at:new Date().toISOString(),text});if(s.status==='unreviewed'){s.status='question';s.reviewedHash=C.items[id].hash}await put(id,s);refreshItem(id);renderNav()}
  else if(el.dataset.dl){e.preventDefault();const b=await getFile(`${el.dataset.dl}/${el.dataset.name}`);if(b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=el.dataset.name;a.click()}}
  else if(el.dataset.rm){const id=el.dataset.rm,s=rs(id);s.files=(s.files||[]).filter(f=>f.name!==el.dataset.name);await delFile(`${id}/${el.dataset.name}`);await put(id,s);refreshItem(id)}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.attach){if(!reviewer()){toast(t('needName'));return}const id=el.dataset.attach,s=rs(id);s.files=s.files||[];
    for(const f of el.files){await putFile(`${id}/${f.name}`,f);s.files=s.files.filter(x=>x.name!==f.name);s.files.push({name:f.name,type:f.type,size:f.size,by:reviewer()})}
    if(s.status==='unreviewed'){s.status='change';s.reviewedHash=C.items[id].hash}await put(id,s);refreshItem(id);renderNav()}
  else if(el.dataset.corr){if(!reviewer()){toast(t('needName'));return}const id=el.dataset.corr,s=rs(id);const f=el.dataset.field,l=el.dataset.lang;
    const orig=(C.items[id].fields||[]).find(x=>x.key===f)?.text?.[l];
    s.corrections=s.corrections||{};s.corrections[f]=s.corrections[f]||{};
    if(el.value===orig||el.value===''){delete s.corrections[f][l];if(!Object.keys(s.corrections[f]).length)delete s.corrections[f]}else s.corrections[f][l]=el.value;
    if(Object.keys(s.corrections).length&&s.status==='unreviewed'){s.status='change';s.reviewedHash=C.items[id].hash}
    await put(id,s);toast(t('saved'));renderNav()}
});
function refreshItem(id){const old=document.getElementById('item-'+id);if(old)old.outerHTML=renderItem(id)}

// ───────── export / import ─────────
const README=`# Qiraah content review — for Claude Code
review.json holds, per content item id (see tools/content_review/content.js):
- status: ok | change | question (unreviewed items are left out)
- comments: [{by, at, text}]
- corrections: {field: {lang: corrected text}} — the reviewer's version of that field
- files: attachments; each one's path in this zip is files[].path (attachments/<item id, made safe>/<name>)
- reviewedHash: the item's content hash when it was reviewed (compare with content.js to see what changed since)
Summarize with: python3 tool/content_review/summarize.py <this zip>
Implement the changes in the app's data/ARB files; Nabr mushaf corrections go to tool/nabr/overrides.json.
`;
function exportJson(){const items={};for(const [id,s] of Object.entries(state))if(s.status!=='unreviewed'||(s.comments||[]).length||(s.files||[]).length||Object.keys(s.corrections||{}).length)items[id]=s;
  return {app:'qiraah_arabiyyah',kind:'content-review',exportedAt:new Date().toISOString(),reviewer:reviewer(),contentGeneratedAt:C.generatedAt,items}}
// An item id as a folder name every system accepts (ids hold ':' and '#').
const safe=id=>id.replace(/[^\w.\-\u0600-\u06FF]/g,'_');
const attPath=(id,f)=>f.path||`attachments/${safe(id)}/${f.name}`;
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
async function exportZip(){
  const data=exportJson();const day=new Date().toISOString().slice(0,10);const who=(reviewer()||'review').replace(/[^\w؀-ۿ-]+/g,'_');
  if(typeof JSZip==='undefined'){toast(t('zipMissing'));download(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),`qiraah-review-${who}-${day}.json`);return}
  const zip=new JSZip();zip.file('review.json',JSON.stringify(data,null,1));zip.file('README_FOR_CLAUDE_CODE.md',README);
  for(const [id,s] of Object.entries(data.items))for(const f of s.files||[]){const b=await getFile(`${id}/${f.name}`);if(b){f.path=attPath(id,f);zip.file(f.path,await bytes(b))}}
  zip.file('review.json',JSON.stringify(data,null,1)); // again, with the attachment paths
  download(await zip.generateAsync({type:'blob'}),`qiraah-review-${who}-${day}.zip`);toast(t('exported'));
}
function mergeOne(id,inc){
  const cur=state[id];
  if(!cur){return {...inc}}
  const out={...cur};
  const key=c=>`${c.by}|${c.at}|${c.text}`;const seen=new Set((cur.comments||[]).map(key));
  out.comments=[...(cur.comments||[]),...(inc.comments||[]).filter(c=>!seen.has(key(c)))].sort((a,b)=>(a.at||'').localeCompare(b.at||''));
  const newer=(inc.updatedAt||'')>(cur.updatedAt||'');
  if(newer){out.status=inc.status;out.reviewedHash=inc.reviewedHash;out.updatedAt=inc.updatedAt;out.updatedBy=inc.updatedBy;
    out.corrections={...(cur.corrections||{}),...(inc.corrections||{})}}
  else out.corrections={...(inc.corrections||{}),...(cur.corrections||{})};
  const names=new Set((cur.files||[]).map(f=>f.name));out.files=[...(cur.files||[]),...(inc.files||[]).filter(f=>!names.has(f.name))];
  return out;
}
async function importFile(file){
  let data, zip=null;
  if(file.name.endsWith('.json'))data=JSON.parse(await file.text());
  else{if(typeof JSZip==='undefined'){toast(t('zipMissing'));return}zip=await JSZip.loadAsync(file);const r=zip.file('review.json');if(!r){toast('review.json?');return}data=JSON.parse(await r.async('string'))}
  let n=0;
  for(const [id,inc] of Object.entries(data.items||{})){
    const merged=mergeOne(id,inc);
    if(zip)for(const f of inc.files||[]){const z=zip.file(attPath(id,f));if(z)await putFile(`${id}/${f.name}`,new Blob([await z.async('uint8array')],{type:f.type||''}))}
    state[id]=merged;await tx('state','readwrite',st=>st.put(merged,id));n++;
  }
  toast(`${t('imported')}: ${n}`);renderAll();
}

// ───────── chrome ─────────
let toastTimer;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function applyUi(){
  document.documentElement.lang=ui;document.documentElement.dir=ui==='ar'?'rtl':'ltr';
  $('#tTitle').textContent=t('title');$('#tReviewer').textContent=t('reviewer');$('#search').placeholder=t('search');$('#tAllLangs').textContent=t('allLangs');
  $('#importBtn').textContent=t('import');$('#exportBtn').textContent=t('export');$('#uiLang').textContent=ui==='ar'?'English':'العربية';
  const f=$('#filter'),v=f.value||'all';f.innerHTML=['all','unreviewed','ok','change','question','changed','english'].map(k=>`<option value="${k}">${t('f_'+k)}</option>`).join('');f.value=v;
  renderAll();
}
$('#uiLang').onclick=()=>{ui=ui==='ar'?'en':'ar';localStorage.setItem('cr.ui',ui);applyUi()};
$('#reviewer').value=localStorage.getItem('cr.reviewer')||'';
$('#reviewer').onchange=()=>localStorage.setItem('cr.reviewer',reviewer());
$('#filter').onchange=renderAll;$('#langsAll').onchange=renderMain;
let searchTimer;$('#search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(renderAll,200)};
$('#exportBtn').onclick=exportZip;$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''};

// Render at once; then the saved review. Without IndexedDB (a private
// window, some file:// setups) it still works, in memory only.
applyUi();
(async()=>{try{db=await openDb();await loadState();renderAll()}
  catch(_){db=null;toast(t('noStorage'))}})();
</script>
