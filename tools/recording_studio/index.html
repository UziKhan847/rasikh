<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qiraah Recording Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&family=Amiri+Quran&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="manifest.js"></script>
<style>
:root{
  --bg:#F4F1EA;--card:#FFFFFF;--ink:#16201C;--ink2:#47524D;--ink3:#6F7671;--line:#E4E0D6;--line2:#ECE8DF;
  --track:#ECE7DC;--acc:#0F7A62;--accSoft:#E3F1EB;--red:#B4483B;--redSoft:#F6E3E0;--gold:#B4862C;--hero:#0F3B32;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412;--card:#161E1B;--ink:#ECE8DF;--ink2:#C2C8C4;--ink3:#8C958F;--line:#26302B;--line2:#1F2925;
  --track:#1F2925;--acc:#3FB08F;--accSoft:#173A2F;--red:#E07A6C;--redSoft:#3A1F1B;--gold:#E3C27A;--hero:#123326;}}
:root[data-theme="dark"]{
  --bg:#0E1412;--card:#161E1B;--ink:#ECE8DF;--ink2:#C2C8C4;--ink3:#8C958F;--line:#26302B;--line2:#1F2925;
  --track:#1F2925;--acc:#3FB08F;--accSoft:#173A2F;--red:#E07A6C;--redSoft:#3A1F1B;--gold:#E3C27A;--hero:#123326;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:default}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font:500 22px/1.2 "Source Serif 4",serif;margin:0;flex:1 1 auto}
.seg{display:inline-flex;background:var(--track);padding:3px;border-radius:14px;gap:2px}
.seg button{height:34px;padding:0 14px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.pill.primary{background:var(--acc);border-color:var(--acc);color:#fff}
select{font:inherit;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;max-width:260px}
main{flex:1;display:flex;min-height:0}
aside{width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside .tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
aside input[type=search]{height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font:inherit}
#list{overflow:auto;flex:1;padding:6px 8px 20px}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:14px 8px 6px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:10px;text-align:left}
.row:hover{background:var(--track)}
.row.cur{background:var(--accSoft)}
.row .ar{font:22px/1.5 "Noto Naskh Arabic",serif;direction:rtl;min-width:56px;text-align:right}
.row .sub{font-size:12px;color:var(--ink3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.dot.done{background:var(--acc);border-color:var(--acc)}
section#stage{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 18px 40px}
.wrap{width:100%;max-width:760px}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink3);font-weight:600}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line)}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--acc);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:24px;margin-top:16px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.big{font:clamp(84px,16vw,150px)/1.55 "Amiri Quran","Noto Naskh Arabic",serif;text-align:center;direction:rtl;margin:6px 0 0}
.say{text-align:center;font-size:18px;color:var(--ink2);margin-top:4px}
.file{text-align:center;font:12px/1.4 ui-monospace,monospace;color:var(--ink3);margin-top:8px}
.status{display:flex;justify-content:center;margin-top:14px}
.badge{font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:12px;background:var(--track);color:var(--ink2)}
.badge.saved{background:var(--accSoft);color:var(--acc)}
.badge.rec{background:var(--redSoft);color:var(--red)}
.meter{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:18px}
.meter > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--gold) 75%,var(--red));transition:width .05s}
canvas#wave{width:100%;height:84px;display:block;margin-top:14px;border-radius:14px;background:var(--track)}
video{width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:20px;background:#000;display:block;margin:16px auto 0}
#live{transform:scaleX(-1)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{height:52px;padding:0 22px;border-radius:26px;border:1px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.rec{background:var(--red);border-color:var(--red);color:#fff;min-width:150px;justify-content:center}
.btn.rec.on{animation:pulse 1s infinite}
.btn.keep{background:var(--acc);border-color:var(--acc);color:#fff}
@keyframes pulse{50%{opacity:.7}}
.keys{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:14px}
kbd{font:600 11.5px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--card)}
.opts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:13px;color:var(--ink2)}
.opts label{display:inline-flex;gap:6px;align-items:center}
.note{font-size:13px;color:var(--ink3);text-align:center;margin-top:6px}
.count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font:500 160px "Source Serif 4",serif;color:#fff;background:rgba(0,0,0,.35);pointer-events:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:820px){main{flex-direction:column}aside{width:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Qiraah Recording Studio</h1>
  <div class="seg" id="modeSeg"><button data-m="audio" class="on">Audio</button><button data-m="video">Video</button></div>
  <select id="mic" title="Microphone"></select>
  <select id="cam" title="Camera" hidden></select>
  <button class="pill" id="importBtn" title="Restore recordings from an exported zip">Import zip</button>
  <button class="pill primary" id="exportBtn">Export zip</button>
  <input type="file" id="importFile" accept=".zip" hidden>
</header>
<main>
  <aside>
    <div class="tools">
      <input type="search" id="search" placeholder="Search letters, sections…">
      <div class="seg" id="filterSeg"><button data-f="all" class="on">All</button><button data-f="todo">To do</button><button data-f="done">Done</button></div>
      <select id="prio"><option value="all">Every priority</option><option value="core">Core first</option><option value="next">Next</option><option value="later">Later</option></select>
    </div>
    <div id="list"></div>
  </aside>
  <section id="stage"><div class="wrap">
    <div class="progress"><span id="progText">0 / 0</span><div class="bar"><i id="progBar"></i></div><span id="secText"></span></div>
    <div class="card">
      <div class="label" id="secLabel"></div>
      <div class="big" id="bigText"></div>
      <div class="say" id="sayText"></div>
      <div class="note" id="noteText"></div>
      <div class="file" id="fileText"></div>
      <div class="status"><span class="badge" id="badge">Not recorded</span></div>
      <div id="audioUi">
        <div class="meter"><i id="meter"></i></div>
        <canvas id="wave" width="1400" height="168"></canvas>
      </div>
      <div id="videoUi" hidden>
        <video id="live" autoplay muted playsinline></video>
        <video id="take" controls playsinline hidden></video>
      </div>
      <div class="controls">
        <button class="btn" id="prevBtn" title="Previous (←)">‹ Prev</button>
        <button class="btn rec" id="recBtn">● Record</button>
        <button class="btn" id="playBtn" disabled>▶ Play</button>
        <button class="btn" id="redoBtn" disabled>↺ Re-record</button>
        <button class="btn keep" id="keepBtn" disabled>Keep &amp; next ›</button>
        <button class="btn" id="nextBtn" title="Skip (→)">Skip ›</button>
      </div>
      <div class="keys"><kbd>Space</kbd> record / stop · <kbd>P</kbd> play · <kbd>R</kbd> re-record · <kbd>Enter</kbd> keep &amp; next · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>Del</kbd> delete saved take</div>
      <div class="opts" id="audioOpts">
        <label><input type="checkbox" id="autoStop" checked> Stop by itself after a pause</label>
        <label><input type="checkbox" id="trim" checked> Trim silence</label>
        <label><input type="checkbox" id="norm" checked> Even out the volume</label>
        <label><input type="checkbox" id="autoPlay" checked> Play back after recording</label>
      </div>
      <div class="opts" id="videoOpts" hidden>
        <label><input type="checkbox" id="countdown" checked> 3-2-1 countdown</label>
        <label>Max length <select id="vmax"><option>6</option><option selected>10</option><option>20</option><option>40</option></select> s</label>
      </div>
    </div>
    <p class="note">Everything is saved in this browser as you go — close the tab and come back any time. Export when you're done (or whenever you want a backup).</p>
  </div></section>
</main>
<div class="count" id="count"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const ITEMS = (window.MANIFEST || []);
const $ = s => document.querySelector(s);
const state = {
  mode: localStorage.getItem('qs.mode') || 'audio',
  filter: 'all', prio: 'all', q: '',
  idx: {audio: +(localStorage.getItem('qs.idx.audio')||0), video: +(localStorage.getItem('qs.idx.video')||0)},
  saved: new Map(),       // id -> {mime, ext, ms}
  take: null,             // pending {blob, mime, ext, ms, samples?}
  recording: false,
};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
function save(k,v){try{localStorage.setItem(k,v)}catch(_){}}

// ───────── storage (IndexedDB) ─────────
let db;
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('qiraah-studio',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('clips',{keyPath:'id'});
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);});}
function tx(mode){return db.transaction('clips',mode).objectStore('clips');}
function putClip(c){return new Promise((res,rej)=>{const r=tx('readwrite').put(c);r.onsuccess=res;r.onerror=()=>rej(r.error);});}
function getClip(id){return new Promise(res=>{const r=tx('readonly').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});}
function delClip(id){return new Promise(res=>{const r=tx('readwrite').delete(id);r.onsuccess=res;r.onerror=res;});}
function allMeta(){return new Promise(res=>{const out=[];const r=tx('readonly').openCursor();
  r.onsuccess=()=>{const c=r.result;if(!c)return res(out);const v=c.value;out.push({id:v.id,mime:v.mime,ext:v.ext,ms:v.ms});c.continue();};});}

// ───────── list ─────────
function view(){return ITEMS.filter(i=>i.kind===state.mode);}
function visible(){
  const q=state.q.trim().toLowerCase();
  return view().filter(i=>{
    if(state.filter==='todo'&&state.saved.has(i.id))return false;
    if(state.filter==='done'&&!state.saved.has(i.id))return false;
    if(state.prio!=='all'&&i.priority!==state.prio)return false;
    if(q&&!(i.text.includes(q)||i.say.toLowerCase().includes(q)||i.section.toLowerCase().includes(q)||i.path.includes(q)))return false;
    return true;});
}
function cur(){const v=view();return v[Math.min(state.idx[state.mode],v.length-1)];}
function renderList(){
  const list=$('#list');list.innerHTML='';
  const items=visible(); const c=cur(); let sec=null; const frag=document.createDocumentFragment();
  const secTotals={};for(const i of view()){const s=secTotals[i.section]||(secTotals[i.section]={n:0,d:0});s.n++;if(state.saved.has(i.id))s.d++;}
  for(const i of items){
    if(i.section!==sec){sec=i.section;const h=document.createElement('div');h.className='sec';
      h.innerHTML=`<span></span><span>${secTotals[sec].d}/${secTotals[sec].n}</span>`;h.firstChild.textContent=sec;frag.appendChild(h);}
    const b=document.createElement('button');b.className='row'+(c&&i.id===c.id?' cur':'');
    b.innerHTML=`<span class="dot${state.saved.has(i.id)?' done':''}"></span><span class="ar"></span><span class="sub"></span>`;
    b.querySelector('.ar').textContent=i.text;b.querySelector('.sub').textContent=i.say;
    b.onclick=()=>go(view().indexOf(i));frag.appendChild(b);}
  list.appendChild(frag);
  const curRow=list.querySelector('.row.cur');if(curRow)curRow.scrollIntoView({block:'nearest'});
}
function renderItem(){
  const i=cur();if(!i)return;
  const v=view();const done=v.filter(x=>state.saved.has(x.id)).length;
  $('#progText').textContent=`${done} / ${v.length} recorded`;
  $('#progBar').style.width=(100*done/Math.max(1,v.length))+'%';
  $('#secText').textContent=`#${v.indexOf(i)+1}`;
  $('#secLabel').textContent=i.section+(i.priority!=='core'?` · ${i.priority}`:'');
  $('#bigText').textContent=i.text;
  $('#sayText').textContent=i.say;
  $('#noteText').textContent=i.note||'';
  const s=state.saved.get(i.id);
  $('#fileText').textContent=i.path+'.'+(s?s.ext:(state.mode==='audio'?'wav':'webm'));
  const b=$('#badge');
  if(state.recording){b.className='badge rec';b.textContent='Recording…';}
  else if(state.take){b.className='badge';b.textContent=`New take · ${(state.take.ms/1000).toFixed(1)} s — keep it or re-record`;}
  else if(s){b.className='badge saved';b.textContent=`Saved · ${(s.ms/1000).toFixed(1)} s`;}
  else{b.className='badge';b.textContent='Not recorded';}
  $('#playBtn').disabled=!(state.take||s);
  $('#redoBtn').disabled=!(state.take||s);
  $('#keepBtn').disabled=!state.take;
  $('#recBtn').textContent=state.recording?'■ Stop':'● Record';
  $('#recBtn').classList.toggle('on',state.recording);
}
async function go(n){
  if(state.recording)return;
  const v=view();if(!v.length)return;
  state.idx[state.mode]=Math.max(0,Math.min(v.length-1,n));save('qs.idx.'+state.mode,state.idx[state.mode]);
  state.take=null;clearWave();
  if(state.mode==='video'){const t=$('#take');t.hidden=true;t.removeAttribute('src');$('#live').hidden=false;}
  renderItem();renderList();
  const s=state.saved.get(cur().id);
  if(s&&state.mode==='audio'){const c=await getClip(cur().id);if(c&&c.peaks)drawWave(c.peaks);}
}
function nextTodo(){
  const v=view();const vis=new Set(visible().map(i=>i.id));const from=state.idx[state.mode];
  for(let k=1;k<=v.length;k++){const i=v[(from+k)%v.length];if(!state.saved.has(i.id)&&vis.has(i.id))return go(v.indexOf(i));}
  go(from+1);
}

// ───────── devices ─────────
async function listDevices(){
  const ds=await navigator.mediaDevices.enumerateDevices();
  for(const [sel,kind,key] of [[$('#mic'),'audioinput','qs.mic'],[$('#cam'),'videoinput','qs.cam']]){
    const keep=localStorage.getItem(key);sel.innerHTML='';
    ds.filter(d=>d.kind===kind).forEach((d,n)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`${kind==='audioinput'?'Microphone':'Camera'} ${n+1}`;if(d.deviceId===keep)o.selected=true;sel.appendChild(o);});
  }
}
let stream=null, ctx=null, analyser=null, proc=null, chunks=[], meterRaf=0;
async function openAudio(){
  closeStreams();
  const id=$('#mic').value;
  stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:id?{exact:id}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);
  proc=ctx.createScriptProcessor(4096,1,1);src.connect(proc);proc.connect(ctx.destination);
  proc.onaudioprocess=e=>{if(state.recording&&state.mode==='audio'){const d=e.inputBuffer.getChannelData(0);chunks.push(new Float32Array(d));vad(d);}};
  meter();await listDevices();
}
async function openVideo(){
  closeStreams();
  const mic=$('#mic').value, cam=$('#cam').value;
  stream=await navigator.mediaDevices.getUserMedia({
    video:{deviceId:cam?{exact:cam}:undefined,width:{ideal:480},height:{ideal:480},frameRate:{ideal:24,max:30}},
    audio:{deviceId:mic?{exact:mic}:undefined,echoCancellation:true,noiseSuppression:true}});
  $('#live').srcObject=stream;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=ctx.createAnalyser();ctx.createMediaStreamSource(stream).connect(analyser);meter();
  await listDevices();
}
function closeStreams(){cancelAnimationFrame(meterRaf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)ctx.close();ctx=null;}
function meter(){const buf=new Float32Array(1024);const tick=()=>{if(!analyser)return;analyser.getFloatTimeDomainData(buf);let p=0;for(const x of buf)p=Math.max(p,Math.abs(x));$('#meter').style.width=Math.min(100,p*140)+'%';meterRaf=requestAnimationFrame(tick);};tick();}

// ───────── audio recording ─────────
let heard=false, quietFor=0, recStart=0;
function vad(d){
  let s=0;for(const x of d)s+=x*x;const rms=Math.sqrt(s/d.length);
  const dt=d.length/ctx.sampleRate;
  if(rms>0.02){heard=true;quietFor=0;}else if(heard)quietFor+=dt;
  if($('#autoStop').checked&&heard&&quietFor>0.9)stopRec();
  if(performance.now()-recStart>12000)stopRec();
}
async function startRec(){
  if(state.mode==='video')return startVideo();
  if(!ctx)await openAudio();
  if(ctx.state==='suspended')await ctx.resume();
  chunks=[];heard=false;quietFor=0;recStart=performance.now();state.recording=true;state.take=null;renderItem();
}
function stopRec(){
  if(!state.recording)return;
  if(state.mode==='video')return stopVideo();
  state.recording=false;
  let n=0;for(const c of chunks)n+=c.length;
  let x=new Float32Array(n);let o=0;for(const c of chunks){x.set(c,o);o+=c.length;}
  const sr=ctx.sampleRate;
  if($('#trim').checked)x=trimSilence(x,sr);
  if($('#norm').checked)normalise(x);
  if(x.length<sr*0.08){state.take=null;renderItem();toast('Nothing heard — check the microphone and try again');return;}
  const blob=wav(x,sr);const peaks=peaksOf(x);
  state.take={blob,mime:'audio/wav',ext:'wav',ms:Math.round(1000*x.length/sr),peaks};
  drawWave(peaks);renderItem();
  if($('#autoPlay').checked)play();
}
function trimSilence(x,sr){
  const win=Math.round(sr*0.01);let first=-1,last=-1;
  for(let i=0;i+win<=x.length;i+=win){let s=0;for(let k=i;k<i+win;k++)s+=x[k]*x[k];if(Math.sqrt(s/win)>0.015){if(first<0)first=i;last=i+win;}}
  if(first<0)return new Float32Array(0);
  const pad=Math.round(sr*0.12);const a=Math.max(0,first-pad),b=Math.min(x.length,last+pad);
  const y=x.slice(a,b);const f=Math.round(sr*0.01);
  for(let i=0;i<f&&i<y.length;i++){y[i]*=i/f;y[y.length-1-i]*=i/f;}
  return y;
}
function normalise(x){let p=0;for(const v of x)p=Math.max(p,Math.abs(v));if(p<1e-4)return;const g=Math.min(8,0.89/p);for(let i=0;i<x.length;i++)x[i]*=g;}
function wav(x,sr){
  const b=new ArrayBuffer(44+x.length*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+x.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,x.length*2,true);
  for(let i=0;i<x.length;i++){const s=Math.max(-1,Math.min(1,x[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);}
  return new Blob([b],{type:'audio/wav'});
}
function peaksOf(x){const n=300,out=[];const step=Math.max(1,Math.floor(x.length/n));for(let i=0;i<x.length;i+=step){let p=0;for(let k=i;k<Math.min(x.length,i+step);k++)p=Math.max(p,Math.abs(x[k]));out.push(+p.toFixed(3));}return out;}
function clearWave(){const c=$('#wave'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);}
function drawWave(p){
  const c=$('#wave'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
  const w=c.width/p.length,h=c.height;
  p.forEach((v,i)=>{const bh=Math.max(2,v*h*.9);g.fillRect(i*w,(h-bh)/2,Math.max(1,w-1),bh);});
}
let player=null;
async function play(){
  const i=cur();let blob=state.take&&state.take.blob;
  if(!blob){const c=await getClip(i.id);blob=c&&c.blob;}
  if(!blob)return;
  if(state.mode==='video'){const t=$('#take');t.hidden=false;$('#live').hidden=true;t.src=URL.createObjectURL(blob);t.play();return;}
  if(player){player.pause();URL.revokeObjectURL(player.src);}
  player=new Audio(URL.createObjectURL(blob));player.play();
}

// ───────── video recording ─────────
let mr=null, vchunks=[], vTimer=0;
function pickMime(){
  for(const m of ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4;codecs=avc1,mp4a','video/mp4'])
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;
  return '';
}
async function startVideo(){
  if(!stream)await openVideo();
  $('#take').hidden=true;$('#live').hidden=false;
  if($('#countdown').checked){const el=$('#count');el.style.display='flex';for(const n of [3,2,1]){el.textContent=n;await new Promise(r=>setTimeout(r,700));}el.style.display='none';}
  const mime=pickMime();
  mr=new MediaRecorder(stream,{mimeType:mime||undefined,videoBitsPerSecond:350000,audioBitsPerSecond:48000});
  vchunks=[];mr.ondataavailable=e=>{if(e.data.size)vchunks.push(e.data);};
  mr.onstop=()=>{const type=mr.mimeType||mime||'video/webm';const blob=new Blob(vchunks,{type});
    state.take={blob,mime:type,ext:type.includes('mp4')?'mp4':'webm',ms:Math.round(performance.now()-recStart)};renderItem();play();};
  recStart=performance.now();mr.start(250);state.recording=true;state.take=null;renderItem();
  vTimer=setTimeout(stopVideo,(+$('#vmax').value)*1000);
}
function stopVideo(){clearTimeout(vTimer);if(mr&&mr.state!=='inactive')mr.stop();state.recording=false;renderItem();}

// ───────── keep / delete ─────────
async function keep(){
  const i=cur();const t=state.take;if(!t)return;
  await putClip({id:i.id,blob:t.blob,mime:t.mime,ext:t.ext,ms:t.ms,peaks:t.peaks||null,savedAt:Date.now()});
  state.saved.set(i.id,{mime:t.mime,ext:t.ext,ms:t.ms});state.take=null;
  nextTodo();
}
function redo(){state.take=null;clearWave();if(state.mode==='video'){$('#take').hidden=true;$('#live').hidden=false;}renderItem();startRec();}
async function removeSaved(){
  const i=cur();if(!state.saved.has(i.id))return;
  if(!confirm('Delete the saved take for this item?'))return;
  await delClip(i.id);state.saved.delete(i.id);clearWave();renderItem();renderList();
}

// ───────── export / import ─────────
async function exportZip(){
  if(typeof JSZip==='undefined'){toast('The zip library did not load — check your internet connection');return;}
  const zip=new JSZip();const files=[];const missing=[];
  toast('Building the zip…');
  for(const i of ITEMS){
    const s=state.saved.get(i.id);
    if(!s){missing.push({id:i.id,kind:i.kind,section:i.section,text:i.text,path:i.path});continue;}
    const c=await getClip(i.id);if(!c)continue;
    const file=`${i.path}.${c.ext}`;zip.file(file,c.blob);
    files.push({id:i.id,kind:i.kind,section:i.section,text:i.text,say:i.say,priority:i.priority,file,mime:c.mime,durationMs:c.ms});
  }
  zip.file('manifest.json',JSON.stringify({app:'qiraah_arabiyyah',exportedAt:new Date().toISOString(),
    recorded:files.length,total:ITEMS.length,files,missing},null,1));
  zip.file('README_FOR_CLAUDE_CODE.md',README);
  const blob=await zip.generateAsync({type:'blob'},m=>{});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`qiraah-recordings-${new Date().toISOString().slice(0,10)}.zip`;a.click();
  toast(`Exported ${files.length} recordings`);
}
async function importZip(file){
  const zip=await JSZip.loadAsync(file);const m=zip.file('manifest.json');
  if(!m){toast('That zip has no manifest.json');return;}
  const man=JSON.parse(await m.async('string'));let n=0;
  for(const f of man.files||[]){const z=zip.file(f.file);if(!z)continue;
    const blob=new Blob([await z.async('arraybuffer')],{type:f.mime});
    await putClip({id:f.id,blob,mime:f.mime,ext:f.file.split('.').pop(),ms:f.durationMs,peaks:null,savedAt:Date.now()});
    state.saved.set(f.id,{mime:f.mime,ext:f.file.split('.').pop(),ms:f.durationMs});n++;}
  renderItem();renderList();toast(`Imported ${n} recordings`);
}
const README=`# Qiraah recordings

Recorded with tools/recording_studio. manifest.json lists every file (id,
the Arabic text, what was said, duration) and every item still missing.

## Audio  (audio/… → assets/audio/letters/adult/)
- Files are mono 16-bit WAV, already trimmed and levelled.
- Names are the Unicode codepoints of the text, joined with "-"
  (lib/core/letter_audio.dart, LetterAudio.assetName): ب → 0628, بَ → 0628-064e.
- To ship: convert each to MP3 (e.g. ffmpeg -i x.wav -ac 1 -b:a 64k x.mp3),
  keep the same path, add the folder under assets: in pubspec.yaml.
- Letter names (1–2) already play through LetterAudio.play. The syllable
  sections (ḥarakāt, tanwīn, madd, sukūn, shaddah) and the example words
  need wiring to LetterAudio.playRaw where those lessons show the text.

## Video  (assets/video/…)
- Low-res WebM (or MP4 on Safari), ~480×480, ~350 kbps.
- To ship: transcode to H.264 MP4 (ffmpeg -i x.webm -vf scale=480:-2
  -c:v libx264 -crf 28 -preset slow -c:a aac -b:a 64k x.mp4) and wire the
  lesson "Watch" buttons (MediaRow in lib/widgets/common.dart) to them.
`;

// ───────── wiring ─────────
function setMode(m){
  if(state.recording)return;
  state.mode=m;save('qs.mode',m);
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#audioUi').hidden=m!=='audio';$('#videoUi').hidden=m!=='video';
  $('#audioOpts').hidden=m!=='audio';$('#videoOpts').hidden=m!=='video';$('#cam').hidden=m!=='video';
  closeStreams();
  (m==='audio'?openAudio():openVideo()).catch(e=>toast('Allow the '+(m==='audio'?'microphone':'camera')+' to record: '+e.message));
  go(state.idx[m]);
}
$('#modeSeg').onclick=e=>{const m=e.target.dataset.m;if(m)setMode(m);};
$('#filterSeg').onclick=e=>{const f=e.target.dataset.f;if(!f)return;state.filter=f;document.querySelectorAll('#filterSeg button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));renderList();};
$('#prio').onchange=e=>{state.prio=e.target.value;renderList();};
$('#search').oninput=e=>{state.q=e.target.value;renderList();};
$('#mic').onchange=e=>{save('qs.mic',e.target.value);state.mode==='audio'?openAudio():openVideo();};
$('#cam').onchange=e=>{save('qs.cam',e.target.value);openVideo();};
$('#recBtn').onclick=()=>state.recording?stopRec():startRec();
$('#playBtn').onclick=play;$('#redoBtn').onclick=redo;$('#keepBtn').onclick=keep;
$('#prevBtn').onclick=()=>go(state.idx[state.mode]-1);$('#nextBtn').onclick=()=>go(state.idx[state.mode]+1);
$('#exportBtn').onclick=exportZip;
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{const f=e.target.files[0];if(f)importZip(f);e.target.value='';};
for(const id of ['autoStop','trim','norm','autoPlay','countdown']){const el=$('#'+id);const v=localStorage.getItem('qs.opt.'+id);if(v!==null)el.checked=v==='1';el.onchange=()=>save('qs.opt.'+id,el.checked?'1':'0');}
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  const k=e.key;
  if(k===' '){e.preventDefault();state.recording?stopRec():startRec();}
  else if(k==='Enter'){e.preventDefault();keep();}
  else if(k==='p'||k==='P')play();
  else if(k==='r'||k==='R')redo();
  else if(k==='ArrowRight')go(state.idx[state.mode]+1);
  else if(k==='ArrowLeft')go(state.idx[state.mode]-1);
  else if(k==='Delete')removeSaved();
});
(async()=>{
  if(!ITEMS.length){toast('manifest.js is missing — run gen_manifest.dart');return;}
  try{await navigator.storage?.persist?.();}catch(_){}
  await openDb();
  for(const m of await allMeta())state.saved.set(m.id,m);
  setMode(state.mode);
})();
</script>
